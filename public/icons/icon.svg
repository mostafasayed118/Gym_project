<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Dumbbell icon -->
  <g transform="translate(256, 256)" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round">
    <!-- Bar -->
    <line x1="-120" y1="0" x2="120" y2="0"/>
    <!-- Left weight -->
    <rect x="-160" y="-40" width="40" height="80" rx="8" fill="url(#accent)"/>
    <!-- Right weight -->
    <rect x="120" y="-40" width="40" height="80" rx="8" fill="url(#accent)"/>
    <!-- Left grip -->
    <line x1="-120" y1="-24" x2="-120" y2="24"/>
    <!-- Right grip -->
    <line x1="120" y1="-24" x2="120" y2="24"/>
  </g>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">GYMPRO</text>
</svg>
