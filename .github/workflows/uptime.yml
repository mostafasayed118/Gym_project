name: Uptime Monitor

# External uptime monitor that replaced the Vercel cron (vercel.json was
# removed because Hobby plan allows only one cron/day). GitHub's own
# infrastructure probes the production app every 5 minutes — the same cadence
# the Vercel cron used — and alerts on any outage.
#
# Alert channels:
#   1. GitHub's default workflow-failure notifications (email to repo watchers)
#      fire whenever this job fails.
#   2. If a Slack/Discord/Teams-style incoming webhook is stored as the
#      ALERT_WEBHOOK_URL repository secret, a `{ "text": ... }` payload is
#      POSTed to it on failure (same convention as /api/cron/health).
#   3. If a Healthchecks.io check's ping URL is stored as the
#      HEALTHCHECKS_PING_URL repository secret, this job pings it on every
#      run (success ping, or /fail on probe failure). Healthchecks then
#      alerts from its own servers — including when this monitor stops
#      pinging entirely — so alerting doesn't depend on GitHub's cron.
#
# NOTE: GitHub's scheduled cron for this workflow has been observed NOT to
# fire (known Actions issue). For production alerting, prefer an external
# active monitor (UptimeRobot/Healthchecks); this workflow is the best-effort
# layer.
#
# Drill-testing: trigger with `workflow_dispatch` and `force_fail: true` to
# deliberately fail the probe — the exact outage path (failure -> webhook
# POST) runs without touching production. The webhook step prints
# "webhook status=200" when delivery succeeds.
#
# Note: GitHub pauses scheduled workflows after 60 days of repository
# inactivity. Any push/PR activity to this repo keeps the monitor running.

on:
  schedule:
    # Every 5 minutes — GitHub Actions' minimum interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Drill: force the probe to fail so the alert path is exercised"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    name: Probe /api/health?deep=true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deep health probe
        id: probe
        run: |
          if [ "${{ github.event.inputs.force_fail }}" = "true" ]; then
            echo "::warning::DRILL MODE — deliberately failing the probe to test alert delivery"
            echo "probe=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 \
            "https://gym-project-azure.vercel.app/api/health?deep=true" || true)
          body=$(cat /tmp/health.json)
          echo "HTTP $code: $body"
          # Fail unless we got a 200 whose body reports the Convex backend as ok.
          if [ "$code" != "200" ]; then
            echo "::error::Deep health probe returned HTTP $code (expected 200)"
            exit 1
          fi
          if ! echo "$body" | grep -q '"convex":"ok"'; then
            echo "::error::Deep health probe did not report convex:ok"
            exit 1
          fi
          echo "probe=ok" >> "$GITHUB_OUTPUT"

      - name: Ping Healthchecks.io (dead-man's switch)
        if: always()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            echo "HEALTHCHECKS_PING_URL not set — skipping"
            exit 0
          fi
          # Success -> plain ping; probe failure -> /fail (Healthchecks flips
          # to DOWN and alerts from its own servers). If this monitor stops
          # pinging entirely (e.g. GitHub's cron drops the run), the check
          # goes DOWN after the grace period — so alerting never depends on
          # GitHub's scheduler, only best-effort pings do.
          if [ "${{ steps.probe.outcome }}" = "success" ]; then
            PING_URL="$HEALTHCHECKS_PING_URL"
          else
            PING_URL="${HEALTHCHECKS_PING_URL%/}/fail"
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PING_URL" || true)
          echo "healthchecks ping status=$code"
          if [ "$code" != "200" ]; then
            echo "::warning::Healthchecks ping returned HTTP $code"
          fi

      - name: Send webhook alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set — relying on GitHub failure notifications"
            exit 0
          fi
          msg="🚨 GymPro outage detected: /api/health?deep=true failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Check https://gym-project-azure.vercel.app/api/health?deep=true"
          # Slack wants {text}, Discord wants {content} — pick per webhook host.
          if [[ "$ALERT_WEBHOOK_URL" == *"discord"* ]]; then
            payload=$(jq -Rn --arg content "$msg" '{content:$content}')
          else
            payload=$(jq -Rn --arg text "$msg" '{text:$text}')
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload" || true)
          echo "webhook status=$code"
          # 200 (Slack) or 204 (Discord) means the platform accepted the message.
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::Webhook delivery failed with HTTP $code"
            exit 1
          fi
