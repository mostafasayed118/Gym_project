<!-- Micro-interaction for OTP inputs -->
<script>
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Handle styling for focused state via JS to maintain technical precision
            input.addEventListener('focus', () => {
                inputs.forEach(i => i.classList.remove('border-primary-fixed', 'border-2', 'shadow-[0_0_10px_rgba(195,244,0,0.2)]'));
                input.classList.add('border-primary-fixed', 'border-2', 'shadow-[0_0_10px_rgba(195,244,0,0.2)]');
            });
            
            input.addEventListener('blur', () => {
                if(!input.value) {
                    input.classList.remove('border-primary-fixed', 'border-2', 'shadow-[0_0_10px_rgba(195,244,0,0.2)]');
                }
            });
        });
    </script>
