            border-color: #abd600;

<script>
        // Micro-interaction for password strength visualization
        const passwordInput = document.getElementById('password-input');
        const segments = [
            document.getElementById('seg-1'),
            document.getElementById('seg-2'),
            document.getElementById('seg-3'),
            document.getElementById('seg-4')
        ];

        passwordInput.addEventListener('input', (e) => {
            const length = e.target.value.length;
            
            // Simplified strength logic
            if (length === 0) {
                segments.forEach(s => s.className = 'strength-segment bg-outline-variant/40');
            } else if (length < 4) {
                segments[0].className = 'strength-segment bg-error';
                segments.slice(1).forEach(s => s.className = 'strength-segment bg-outline-variant/40');
            } else if (length < 8) {
                segments[0].className = 'strength-segment bg-secondary-fixed';
                segments[1].className = 'strength-segment bg-secondary-fixed';
                segments.slice(2).forEach(s => s.className = 'strength-segment bg-outline-variant/40');
            } else {
                segments.forEach(s => s.className = 'strength-segment bg-primary-fixed');
                segments.forEach(s => s.style.boxShadow = '0 0 8px rgba(171, 214, 0, 0.4)');
            }
        });

        // Form submission prevention for demo
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Form submitted');
        });
    </script>
