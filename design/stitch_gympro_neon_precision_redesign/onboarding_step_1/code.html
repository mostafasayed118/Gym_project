<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GymPro | Onboarding - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(171, 214, 0, 0.3);
        }
        .active-glow {
            box-shadow: 0 0 30px rgba(171, 214, 0, 0.25);
        }
        .glass-card {
            background: rgba(24, 24, 27, 0.5);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(63, 63, 70, 0.8);
        }
        .role-card:hover {
            border-color: #abd600;
            background: rgba(171, 214, 0, 0.05);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#63f7ff",
                      "tertiary-container": "#d2e5f5",
                      "error": "#ffb4ab",
                      "on-tertiary-fixed": "#0b1d29",
                      "inverse-on-surface": "#2f3223",
                      "inverse-surface": "#e2e4cf",
                      "background": "#111508",
                      "on-surface": "#e2e4cf",
                      "tertiary-fixed": "#d2e5f5",
                      "surface-dim": "#111508",
                      "on-background": "#e2e4cf",
                      "on-tertiary-fixed-variant": "#374956",
                      "on-primary-fixed": "#161e00",
                      "surface-container-lowest": "#0c0f04",
                      "surface-container-highest": "#333627",
                      "primary": "#ffffff",
                      "on-secondary-container": "#006c71",
                      "surface-bright": "#373b2c",
                      "surface-container-low": "#1a1d10",
                      "primary-fixed-dim": "#abd600",
                      "surface-variant": "#333627",
                      "surface": "#111508",
                      "outline": "#8e9379",
                      "tertiary-fixed-dim": "#b6c9d8",
                      "tertiary": "#ffffff",
                      "on-error-container": "#ffdad6",
                      "primary-container": "#c3f400",
                      "on-surface-variant": "#c4c9ac",
                      "surface-container": "#1e2113",
                      "on-secondary-fixed": "#002021",
                      "on-secondary": "#003739",
                      "outline-variant": "#444933",
                      "error-container": "#93000a",
                      "on-primary-fixed-variant": "#3c4d00",
                      "on-error": "#690005",
                      "on-tertiary-container": "#556774",
                      "secondary": "#e6feff",
                      "secondary-fixed-dim": "#00dce5",
                      "on-primary-container": "#556d00",
                      "on-primary": "#283500",
                      "inverse-primary": "#506600",
                      "surface-tint": "#abd600",
                      "surface-container-high": "#282b1d",
                      "secondary-container": "#00f4fe",
                      "on-tertiary": "#21323e",
                      "primary-fixed": "#c3f400",
                      "on-secondary-fixed-variant": "#004f53"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "8px",
                      "container-max": "1280px",
                      "gutter": "24px",
                      "margin-desktop": "48px",
                      "stack-md": "16px",
                      "margin-mobile": "20px",
                      "stack-lg": "32px"
              },
              "fontFamily": {
                      "headline-lg": ["Geist Sans"],
                      "display-h1": ["Geist Sans"],
                      "label-caps": ["Geist Mono"],
                      "body-md": ["Geist Sans"],
                      "metric-lg": ["Geist Mono"],
                      "metric-sm": ["Geist Mono"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "display-h1": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                      "metric-lg": ["24px", {"lineHeight": "1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "metric-sm": ["14px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}]
              }
            },
          },
        }
      </script>
<style data-extension-injected="absolute-mode" data-cleanup-id="absolute-mode-styles" type="text/css">* {<br>        -webkit-user-select: text !important;<br>        -moz-user-select: text !important;<br>        -ms-user-select: text !important;<br>         user-select: text !important;<br>    }</style><style data-extension-injected="absolute-mode" data-cleanup-id="absolute-mode-styles" type="text/css">* {<br>        -webkit-user-select: text !important;<br>        -moz-user-select: text !important;<br>        -ms-user-select: text !important;<br>         user-select: text !important;<br>    }</style></head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- Atmospheric Background -->
<div class="fixed inset-0 -z-10 overflow-hidden">

<div class="absolute top-1/4 -left-1/4 w-96 h-96 bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-1/4 w-96 h-96 bg-secondary-container/10 blur-[120px] rounded-full"></div>
</div>
<!-- Onboarding Card Container -->
<main class="w-full max-w-[520px] glass-card rounded-xl p-8 transition-all duration-500 animate-in fade-in zoom-in-95">
<!-- Header & Progress -->
<header class="mb-10">
<div class="flex justify-between items-end mb-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em]">Step 1 of 3</span>
<span class="font-label-caps text-label-caps text-primary-fixed">33%</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed w-1/3 shadow-[0_0_10px_#abd600]"></div>
</div>
<h2 class="font-headline-lg text-headline-lg mt-stack-lg text-primary tracking-tight">Let's set up your profile</h2>
</header>
<!-- Form Sections -->
<div class="space-y-stack-lg">
<!-- Name Grid -->
<div class="grid grid-cols-2 gap-stack-md">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">First Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all placeholder:text-on-surface-variant/30" placeholder="Alex" type="text">
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Last Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all placeholder:text-on-surface-variant/30" placeholder="Morgan" type="text">
</div>
</div>
<!-- Role Selection -->
<div class="space-y-4">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1 uppercase">Select Your Role</label>
<div class="grid grid-cols-3 gap-3">
<!-- Athlete (Selected) -->
<button class="role-card flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary-fixed bg-primary-container/10 active-glow transition-all group" onclick="selectRole(this)">
<span class="material-symbols-outlined text-primary-fixed mb-2" style="font-size: 32px;">fitness_center</span>
<span class="font-label-caps text-[10px] text-primary-fixed font-bold">Athlete</span>
</button>
<!-- Coach -->
<button class="role-card flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/30 bg-surface-container-low transition-all group" onclick="selectRole(this)">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed mb-2" style="font-size: 32px;">psychology</span>
<span class="font-label-caps text-[10px] text-on-surface-variant group-hover:text-primary-fixed">Coach</span>
</button>
<!-- Admin -->
<button class="role-card flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/30 bg-surface-container-low transition-all group" onclick="selectRole(this)">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed mb-2" style="font-size: 32px;">admin_panel_settings</span>
<span class="font-label-caps text-[10px] text-on-surface-variant group-hover:text-primary-fixed">Admin</span>
</button>
</div>
</div>
<!-- Fitness Goals -->
<div class="space-y-4">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1 uppercase">Fitness Goal</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-outline-variant/30 text-body-md text-on-surface-variant hover:border-primary-fixed/50 transition-all" onclick="toggleGoal(this)">Weight Loss</button>
<button class="px-4 py-2 rounded-full bg-primary-fixed text-on-primary-fixed font-bold shadow-[0_0_15px_rgba(171,214,0,0.4)] transition-all" onclick="toggleGoal(this)">Build Muscle</button>
<button class="px-4 py-2 rounded-full border border-outline-variant/30 text-body-md text-on-surface-variant hover:border-primary-fixed/50 transition-all" onclick="toggleGoal(this)">Endurance</button>
<button class="px-4 py-2 rounded-full border border-outline-variant/30 text-body-md text-on-surface-variant hover:border-primary-fixed/50 transition-all" onclick="toggleGoal(this)">Flexibility</button>
<button class="px-4 py-2 rounded-full border border-outline-variant/30 text-body-md text-on-surface-variant hover:border-primary-fixed/50 transition-all" onclick="toggleGoal(this)">Powerlifting</button>
</div>
</div>
</div>
<!-- Actions -->
<footer class="mt-12 flex flex-col gap-4">
<button class="w-full h-14 bg-gradient-to-r from-primary-fixed to-secondary-fixed-dim text-background font-bold text-body-md rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_25px_rgba(171,214,0,0.2)] hover:scale-105" style="box-shadow: 0 0 20px oklch(0.85 0.2 145 / 0.3);">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full text-center py-2 text-on-surface-variant/60 hover:text-on-surface text-label-caps font-label-caps transition-colors">
                Skip for now
            </button>
</footer>
</main>
<!-- Micro-interaction Scripts -->
<script>
        function selectRole(el) {
            // Remove active classes from all cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('border-primary-fixed', 'bg-primary-container/10', 'active-glow');
                card.classList.add('border-outline-variant/30', 'bg-surface-container-low');
                
                const icon = card.querySelector('.material-symbols-outlined');
                const text = card.querySelector('span:last-child');
                
                icon.classList.remove('text-primary-fixed');
                icon.classList.add('text-on-surface-variant');
                text.classList.remove('text-primary-fixed', 'font-bold');
                text.classList.add('text-on-surface-variant');
            });

            // Add active classes to selected
            el.classList.add('border-primary-fixed', 'bg-primary-container/10', 'active-glow');
            el.classList.remove('border-outline-variant/30', 'bg-surface-container-low');
            
            const icon = el.querySelector('.material-symbols-outlined');
            const text = el.querySelector('span:last-child');
            
            icon.classList.add('text-primary-fixed');
            icon.classList.remove('text-on-surface-variant');
            text.classList.add('text-primary-fixed', 'font-bold');
            text.classList.remove('text-on-surface-variant');
        }

        function toggleGoal(el) {
            const isActive = el.classList.contains('bg-primary-fixed');
            
            if(isActive) {
                el.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'font-bold', 'shadow-[0_0_15px_rgba(171,214,0,0.4)]');
                el.classList.add('border', 'border-outline-variant/30', 'text-on-surface-variant');
            } else {
                el.classList.add('bg-primary-fixed', 'text-on-primary-fixed', 'font-bold', 'shadow-[0_0_15px_rgba(171,214,0,0.4)]');
                el.classList.remove('border', 'border-outline-variant/30', 'text-on-surface-variant');
            }
        }
    </script>


</body></html>
