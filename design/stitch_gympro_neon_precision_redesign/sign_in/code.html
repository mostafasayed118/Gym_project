<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Add micro-interaction to form submission
        document.getElementById('signin-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Authenticating...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span> Success`;
                btn.classList.add('opacity-80');
            }, 1500);
        });

        // Floating particle effect for high-performance aesthetic
        const container = document.body;
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute bg-primary-fixed/10 rounded-full pointer-events-none';
            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.filter = 'blur(1px)';
            
            container.appendChild(particle);
            
            const animate = () => {
                const duration = Math.random() * 10000 + 5000;
                const keyframes = [
                    { transform: 'translate(0, 0)', opacity: 0.2 },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`, opacity: 0.5 },
                    { transform: 'translate(0, 0)', opacity: 0.2 }
                ];
                particle.animate(keyframes, { duration, iterations: Infinity });
            };
            animate();
        }
